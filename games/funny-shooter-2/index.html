<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1 user-scalable=no" />
    <meta name="author" content="GamePix">
    <title>GamePix Funny Shooter 2</title>
    <style>
        html,
        body {
            position: fixed;
            background-color: black;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        * {
            -webkit-touch-callout: none;
            /* iOS Safari */
            -webkit-user-select: none;
            /* Safari */
            -khtml-user-select: none;
            /* Konqueror HTML */
            -moz-user-select: none;
            /* Old versions of Firefox */
            -ms-user-select: none;
            /* Internet Explorer/Edge */
            user-select: none;
            /* Non-prefixed version, currently supported by Chrome, Opera and Firefox */
            -ms-touch-action: none;
            -ms-content-zooming: none;
            touch-action: none;
            outline: none;
        }
    </style>
    <link rel="shortcut icon" href="TemplateData/favicon.ico"/>
    <link rel="stylesheet" href="TemplateData/style.css"/>
    <script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="0"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
    <div id="unity-logo"><img src="logo.png"/></div>
    <div id="unity-progress-bar-empty" style="display: none;">
    <div id="unity-progress-bar-full"></div>
    </div>
    <div class="spinner"></div>
    </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
          const hideFullScreenButton = "1";
          const buildUrl = "Build";
          const loaderUrl = buildUrl + "/FunnyShooter2_Yandex.loader.js";
          const config = {
            dataUrl: buildUrl + "/FunnyShooter2_Yandex.data.unityweb",
            frameworkUrl: buildUrl + "/FunnyShooter2_Yandex.framework.js.unityweb",
            codeUrl: buildUrl + "/FunnyShooter2_Yandex.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "GoGoMan",
            productName: "Funny Shooter 2",
            productVersion: "1.0.1",
          };

          const container = document.querySelector("#unity-container");
          const canvas = document.querySelector("#unity-canvas");
          const loadingCover = document.querySelector("#loading-cover");
          const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
          const progressBarFull = document.querySelector("#unity-progress-bar-full");
          const fullscreenButton = document.querySelector("#unity-fullscreen-button");
          const spinner = document.querySelector('.spinner');

          const canFullscreen = (function() {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
              ]) {
              if (key in document) {
                return true;
              }
            }
            return false;
          }());

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1;
          }
          canvas.style.background = "url('" + buildUrl + "/FunnyShooter2_Yandex.jpg') center / cover";
          loadingCover.style.display = "";

          const script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              spinner.style.display = "none";
              progressBarEmpty.style.display = "";
              progressBarFull.style.width = `${100 * progress}%`;
              GamePix.loading(progress);
            }).then((unityInstance) => {
              window.unityInstance = unityInstance;
              //loadData();
              loadingCover.style.display = "none";
              if (canFullscreen) {
                if (!hideFullScreenButton) {
                  fullscreenButton.style.display = "";
                }
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }
            }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);
          GamePix.loaded();
        </script>
    <script type="text/javascript">
        var player = null;
        var sdk = null;
        var payments = null;
        var SHOW_ADS = true;

        function checkCom() {
          var isCom = 0;
          var output;

          if (sdk != null) {
            var output = "com"; // TODO: was var output = sdk.environment.i18n.tld;
            if (output == "com") {
              isCom = 1;
            } else if (output == "com.tr") {
              isCom = 2;
            }
          }

          window.unityInstance.SendMessage('GameManager', 'IsCom', isCom);

          if (payments != null) {
            initPurchasing();
            checkShop();
          }
        }

        function purchaseComplete(id) 
        {
            if(id == 0)
            {
                SHOW_ADS = false;
                console.log("hideBannerAdv is not supported");
                // sdk.adv.hideBannerAdv();
            }
        }

        function checkShop() 
        { 
          if (payments != null) {
            payments.getPurchases().then(purchases => {
              if (purchases.some(purchase => purchase.productID === 'remove_ads')) {
                  SHOW_ADS = false;
                  window.unityInstance.SendMessage('SDKPlatforms', 'ShopComplete', 0);
                  console.log("hideBannerAdv is not supported")
                  // sdk.adv.hideBannerAdv();
              }
              if (purchases.some(purchase => purchase.productID === 'weapon_1')) {
                  window.unityInstance.SendMessage('SDKPlatforms', 'ShopComplete', 3);
              }
              if (purchases.some(purchase => purchase.productID === 'weapon_2')) {
                  window.unityInstance.SendMessage('SDKPlatforms', 'ShopComplete', 4);
              }
            }).catch(err => {

            })
          }
        }

        function initPurchasing() {
          console.log('Get Purchasing Data....');
          if (payments != null) {
            var gameShop = []
            payments.getCatalog().then(products => {
              gameShop = products;
              console.log('Get Catalog Data....');
              gameShop.forEach(product => {
                window.unityInstance.SendMessage('SDKPlatforms', 'PurchaseDataId', product.id);
                window.unityInstance.SendMessage('SDKPlatforms', 'PurchaseDataPrice', product.priceValue);
                console.log(product.id + ' ' + product.price);
              });
            });
            payments.getPurchases().then(purchases => purchases.forEach(consumePurchase));
          }
        }

        function consumePurchase(purchase) {
          if (payments != null) {
            window.unityInstance.SendMessage('SDKPlatforms', 'PurchasesComplete', purchase.id);
            payments.consumePurchase(purchase.purchaseToken);
          }
        }


        function buy(id_buy) {
          if (payments != null) {
            payments.purchase({ id: id_buy }).then(purchase => {
              window.unityInstance.SendMessage('SDKPlatforms', 'PurchasesComplete', id_buy);
              if (id_buy != 'remove_ads') 
              {
                payments.consumePurchase(purchase.purchaseToken);
              }
            });
          }
        }

         function checkSave() {
            loadData();
         }

        function checkLanguage() {
          var currentLanguage = 0;
          var output;

          if (sdk != null) {
            var output = sdk.environment.i18n.lang;
            if (output == "ru" || output == "be" || output == "kk" || output == "uk" || output == "uz")
              currentLanguage = 0;
            else if (output == "tr")
              currentLanguage = 2;
            else
              currentLanguage = 1;
          }

          console.log("Language: " + output + " [" + currentLanguage + "]");
          window.unityInstance.SendMessage('GameManager', 'SetLanguage', currentLanguage);
        }

        function loadData() {
          console.log("Try loading......")
          if (player != null) {
            var save1;
            var save2;
            player.getData(["save1", "save2"]).then(data => {
              if(data.save1) {
                console.log("Load")
                window.unityInstance.SendMessage('SDKPlatforms', 'LoadCloudFirst', data.save1);
                window.unityInstance.SendMessage('SDKPlatforms', 'LoadCloud', data.save2);
              }
              else {
                console.log('No Save');
              }
            }).catch(() => {
              console.log('No Save');
            });
          }
      
        }
      </script>
    <script>
        function saveCloud(dataSave, dataSave2, counterSave) {
          console.log("Try saving....... ");
          if (player != null) {
            player.getData(["save1", "counterFunny2", "save2"]).then(data => {
              if (data.counterFunny2) {
                console.log('Counter ' + data.counterFunny2 + " " + counterSave);
                if (data.counterFunny2 < counterSave) {
                  player.setData({
                    save1: dataSave,
                    save2: dataSave2,
                    counterFunny2: counterSave,
                  }).then(() => {
                    console.log('data is set -update');
                  });
                }
              }
              else {
                player.setData({
                  save1: dataSave,
                  save2: dataSave2,
                  counterFunny2: counterSave,
                }).then(() => {
                  console.log('data is set -first');
                });
              }
            }).catch(() => {
              player.setData({
                 save1: dataSave,
                 save2: dataSave2,
                 counterFunny2: counterSave,
              }).then(() => {
                console.log('data is set -first');
              });
            });
          }
        }
      </script>
    <script>
        function showFullscrenAd() {
          if (sdk !== null) {
            sdk.adv.showFullscreenAdv({
              callbacks: {}
            })
          }
        }
      </script>
    <script>
        function rate() {}
      </script>
    <script>
        function showRewardedAd(id) {
          window.unityInstance.SendMessage('SDKPlatforms', 'AudioEnable', 0);
          GamePix.rewardAd().then(function (res) {
            if (res.success) {
              window.unityInstance.SendMessage('SDKPlatforms', 'AudioEnable', 1);
              window.unityInstance.SendMessage('SDKPlatforms', 'BuyComplete', id);
            } else {
              window.unityInstance.SendMessage('SDKPlatforms', 'AudioEnable', 1);
            }
          });
        }
    </script>
  </body>
</html>
